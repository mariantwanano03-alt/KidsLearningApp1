<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Math Challenge - Learn & Play</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h1>🌟 Learn & Play</h1>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="games.html">Games</a>
            <a href="#" id="logoutButton">Logout</a>
        </nav>

    </header>


    <!-- Math Game -->
    <main class="games-page">

        <section class="games-intro">

            <h2>🧮 Math Challenge</h2>

            <p>
                Answer the questions and earn points!
            </p>

        </section>


        <section class="game-card">

            <!-- Question -->
            <div class="question">

                <h3 id="mathQuestion">
                    Loading question...
                </h3>

            </div>


            <!-- Answers -->
            <div class="answers">

                <button
                    class="answer-button"
                    onclick="checkAnswer(0)">
                    Answer 1
                </button>

                <button
                    class="answer-button"
                    onclick="checkAnswer(1)">
                    Answer 2
                </button>

                <button
                    class="answer-button"
                    onclick="checkAnswer(2)">
                    Answer 3
                </button>

                <button
                    class="answer-button"
                    onclick="checkAnswer(3)">
                    Answer 4
                </button>

            </div>


            <!-- Message -->
            <p id="gameMessage"></p>


            <!-- Balloons -->
            <div id="balloonContainer"></div>


            <!-- Points -->
            <p>
                ⭐ Points:
                <span id="gamePoints">0</span>
            </p>


            <!-- Back -->
            <a href="games.html" class="play-button">
                🎮 Back to Games
            </a>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
