<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Games - Learn & Play</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h1>🌟 Learn & Play</h1>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="#" id="logoutButton">Logout</a>
        </nav>

    </header>


    <!-- Games Page -->
    <main class="games-page">

        <!-- Introduction -->
        <section class="games-intro">

            <h2>🎮 Learning Games</h2>

            <p>
                Choose a game and start learning!
            </p>

        </section>


        <!-- Games Container -->
        <section class="games-container">


            <!-- Math Challenge -->
            <div class="game-choice">

                <div class="game-icon">
                    🧮
                </div>

                <h2>Math Challenge</h2>

                <p>
                    Test your maths skills by answering
                    fun questions and earning points!
                </p>

                <a href="maths.html" class="play-button">
                    ▶️ PLAY NOW
                </a>

            </div>


            <!-- Memory Match -->
            <div class="game-choice">

                <div class="game-icon">
                    🧠
                </div>

                <h2>Memory Match</h2>

                <p>
                    Remember the cards and find all
                    the matching pairs!
                </p>

                <a href="memory.html" class="play-button">
                    ▶️ PLAY NOW
                </a>

            </div>


        </section>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
